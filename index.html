<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Game Boy Emulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .gameboy {
            background-color: #8b8b8b;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            width: 320px;
        }
        
        .screen-container {
            background-color: #9bbc0f;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        #screen {
            background-color: #0f380f;
            width: 160px;
            height: 144px;
            image-rendering: pixelated;
            transform: scale(1.5);
            transform-origin: top left;
            margin: 0 auto;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .d-pad {
            position: relative;
            width: 100px;
            height: 100px;
        }
        
        .d-pad button {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
        }
        
        .d-pad .up { top: 0; left: 35px; }
        .d-pad .right { top: 35px; right: 0; }
        .d-pad .down { bottom: 0; left: 35px; }
        .d-pad .left { top: 35px; left: 0; }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .action-row {
            display: flex;
            gap: 10px;
        }
        
        .action-buttons button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background-color: #333;
            color: white;
            font-weight: bold;
        }
        
        .menu-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .menu-buttons button {
            padding: 5px 15px;
            border-radius: 10px;
            border: none;
            background-color: #555;
            color: white;
        }
        
        .rom-controls {
            margin-top: 20px;
        }
        
        .debug {
            margin-top: 20px;
            width: 100%;
            max-width: 500px;
            text-align: left;
        }
        
        .debug pre {
            background-color: #333;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Game Boy Emulator</h1>
    
    <div class="gameboy">
        <div class="screen-container">
            <canvas id="screen" width="160" height="144"></canvas>
        </div>
        
        <div class="controls">
            <div class="d-pad">
                <button class="up" data-key="up">↑</button>
                <button class="right" data-key="right">→</button>
                <button class="down" data-key="down">↓</button>
                <button class="left" data-key="left">←</button>
            </div>
            
            <div class="action-buttons">
                <div class="action-row">
                    <button data-key="b">B</button>
                    <button data-key="a">A</button>
                </div>
            </div>
        </div>
        
        <div class="menu-buttons">
            <button data-key="select">SELECT</button>
            <button data-key="start">START</button>
        </div>
    </div>
    
    <div class="rom-controls">
        <input type="file" id="rom-input" accept=".gb">
        <button id="pause-btn">Pause</button>
        <button id="reset-btn">Reset</button>
    </div>
    
    <div class="debug">
        <h3>Debug Console</h3>
        <pre id="debug-output">Emulator ready. Please load a ROM file.</pre>
    </div>

    <script type="module" src="js/main.js"></script>

</body>
</html>
